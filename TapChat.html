<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#593722">
  <title>TapChat</title>
  <link rel="icon" type="image/png" href="Log.png">
  <link rel="stylesheet" href="TapChat.css">
</head>
<body>
  <header class="site-header" id="home">
    <a class="brand" href="#home" aria-label="TapChat home">
      <img class="logo" src="Log.png" alt="TapChat">
    </a>

    <nav class="site-nav" aria-label="Main navigation">
      <a href="#homes">Home</a>
      <a href="#features">Features</a>
      <button class="contact-button" type="button">Contact Us</button>
    </nav>
  </header>

  <main>
    <section class="hero" id="homes" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow">Chat <span aria-hidden="true">•</span> Connect <span aria-hidden="true">•</span> Share</p>
        <h1 id="hero-title">
          Your Conversations,<br>
          <span>One Tap Away.</span>
        </h1>
        <p class="hero-description">
          Stay connected to people who matter. Share messages, exchange moments,
          and keep your conversations organised in one simple experience.
        </p>
        <button class="get-button" type="button"><a href="./TapChatloginpage.html">
          Get Started <span aria-hidden="true">→</span></a>
        </button>
      </div>

      <div class="hero-art" aria-hidden="true">
        <div class="circle"></div>
        <img class="hero-image" src="Img.png" alt="">
      </div>
    </section>
    
  </main>
</body>
</html>
