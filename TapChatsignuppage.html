<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="Log.png" />
    <title>TapChat</title>

  <link rel="stylesheet" href="./TapChatsignuppage.css" />
  </head>
  <body>
    <main class="loginContainer">
      <section class="welcome-section">
        <div class="welcome-content">
          <span class="brand-badge">TapChat</span>
          <h1>Your people, closer</h1>
          <h3>Make room for good conversations</h3>
          <p>
            Create your account and keep your people, messages, and updates in
            one simple place.
          </p>
        </div>

        <div class="circle circle-one"></div>
        <div class="circle circle-two"></div>
        <div class="circle circle-three"></div>
      </section>

      <section class="signin-section">
        <div class="signin-content">
          <p class="eyebrow">Join TapChat</p>
          <h2>Create account</h2>
          <p class="description">Add your details to get started.</p>

          <form id="signupform" novalidate>
            <div class="input-group">
              <label for="fullname">Adenkunle Micheal</label>
              <div class="field-with-icon">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="M20 21a8 8 0 0 0-16 0"></path>
                    <circle cx="12" cy="8" r="4"></circle>
                  </svg>
                </span>
                <input
                  id="fullname"
                  name="fullname"
                  type="text"
                  placeholder="Your name"
                  autocomplete="name"
                  required
                />
              </div>
            </div>

            <fieldset class="input-group gender-group">
              <legend>Gender</legend>
              <div class="gender-options">
                <label>
                  <input type="radio" name="gender" value="male" required />
                  <span>MALE</span>
                </label>
                <label>
                  <input type="radio" name="gender" value="female" required />
                  <span>FEMALE</span>
                </label>
              </div>
            </fieldset>

            <fieldset class="input-group dob-group">
              <legend>Date of Birth</legend>
              <div class="dob-options">
                <select id="birth-day" name="birth-day" aria-label="Date" required>
                  <option value="">Date</option>
                </select>
                <select id="birth-month" name="birth-month" aria-label="Month" required>
                  <option value="">Month</option>
                  <option value="1">January</option>
                  <option value="2">February</option>
                  <option value="3">March</option>
                  <option value="4">April</option>
                  <option value="5">May</option>
                  <option value="6">June</option>
                  <option value="7">July</option>
                  <option value="8">August</option>
                  <option value="9">September</option>
                  <option value="10">October</option>
                  <option value="11">November</option>
                  <option value="12">December</option>
                </select>
                <select id="birth-year" name="birth-year" aria-label="Year" required>
                  <option value="">Year</option>
                </select>
              </div>
            </fieldset>

            <div class="input-group">
              <label for="email">Email Address</label>
              <div class="field-with-icon">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                    <path d="m3 7 9 6 9-6"></path>
                  </svg>
                </span>
                <input
                  id="email"
                  name="email"
                  type="email"
                  placeholder="username@gmail.com"
                  autocomplete="email"
                  required
                />
              </div>
            </div>

            <div class="input-group">
              <label for="password">Password</label>
              <div class="field-with-icon password-box">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                    <path d="M8 11V8a4 4 0 1 1 8 0v3"></path>
                  </svg>
                </span>
                <input
                  id="password"
                  name="password"
                  type="password"
                  placeholder="Password"
                  autocomplete="new-password"
                  maxlength="8"
                  required
                />
                <button
                  type="button"
                  class="toggle-password"
                  data-password-target="password"
                  aria-label="Show password"
                >
                  Show
                </button>
              </div>
            </div>

            <div class="input-group">
              <label for="confirm-password">Confirm Password</label>
              <div class="field-with-icon password-box">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                    <path d="M8 11V8a4 4 0 1 1 8 0v3"></path>
                  </svg>
                </span>
                <input
                  id="confirm-password"
                  name="confirm-password"
                  type="password"
                  placeholder="Repeat password"
                  autocomplete="new-password"
                  maxlength="8"
                  required
                />
                <button
                  type="button"
                  class="toggle-password"
                  data-password-target="confirm-password"
                  aria-label="Show confirm password"
                >
                  Show
                </button>
              </div>
            </div>

            <button type="submit" class="login-button">Create account →</button>
            <p id="message" class="message" aria-live="polite"></p>
          </form>

          <div class="signup">
            Already a member?
            <a href="TapChatloginpage.html">Sign in</a>
          </div>
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById("signupform");
      const message = document.getElementById("message");
      const passwordInput = document.getElementById("password");
      const confirmPasswordInput = document.getElementById("confirm-password");
      const birthDay = document.getElementById("birth-day");
      const birthMonth = document.getElementById("birth-month");
      const birthYear = document.getElementById("birth-year");
      const currentYear = new Date().getFullYear();

      for (let year = currentYear; year >= 1900; year -= 1) {
        birthYear.add(new Option(year, year));
      }

      function updateBirthDays() {
        const selectedDay = birthDay.value;
        const selectedMonth = Number(birthMonth.value);
        const selectedYear = Number(birthYear.value) || 2000;
        const daysInMonth = selectedMonth
          ? new Date(selectedYear, selectedMonth, 0).getDate()
          : 31;

        birthDay.replaceChildren(new Option("Date", ""));
        for (let day = 1; day <= daysInMonth; day += 1) {
          birthDay.add(new Option(day, day));
        }

        if (Number(selectedDay) <= daysInMonth) {
          birthDay.value = selectedDay;
        }
      }

      birthMonth.addEventListener("change", updateBirthDays);
      birthYear.addEventListener("change", updateBirthDays);
      updateBirthDays();

      document.querySelectorAll("[data-password-target]").forEach((button) => {
        button.addEventListener("click", () => {
          const input = document.getElementById(button.dataset.passwordTarget);
          const isPassword = input.type === "password";
          input.type = isPassword ? "text" : "password";
          button.textContent = isPassword ? "Hide" : "Show";
          button.setAttribute(
            "aria-label",
            `${isPassword ? "Hide" : "Show"} ${input.id === "password" ? "password" : "confirm password"}`
          );
        });
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        message.classList.add("error");

        if (!form.reportValidity()) {
          message.textContent = "Please complete all fields with valid details.";
          return;
        }

        const dateOfBirth = new Date(
          Number(birthYear.value),
          Number(birthMonth.value) - 1,
          Number(birthDay.value)
        );
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        if (dateOfBirth > today) {
          message.textContent = "Please enter a date of birth that is not in the future.";
          birthDay.focus();
          return;
        }

        if (passwordInput.value !== confirmPasswordInput.value) {
          message.textContent = "Your passwords do not match.";
          confirmPasswordInput.focus();
          return;
        }

        message.textContent = "Your details are ready. Account creation needs a connected service.";
      });
    </script>
  </body>
</html>
