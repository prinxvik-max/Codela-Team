<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | TapChat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./forgot.css" />
  </head>
  <body>
    <main class="loginContainer">
      <section class="welcome-section">
        <div class="welcome-content">
          <span class="brand-badge">TapChat</span>
          <h1>Let’s get you back in</h1>
          <h3>Password recovery</h3>
        </div>

        <div class="circle circle-one"></div>
        <div class="circle circle-two"></div>
        <div class="circle circle-three"></div>
      </section>

      <section class="signin-section">
        <div class="signin-content">
          <p class="eyebrow">Account access</p>
          <h2>Forgot password?</h2>
          <p class="description">
            Enter your email address and we’ll send you a code to reset your
            password.
          </p>

          <form id="resetform">
            <div class="input-group">
              <label for="email">Email Address</label>
              <div class="field-with-icon">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                    <path d="m3 7 9 6 9-6"></path>
                  </svg>
                </span>
                <input
                  id="email"
                  name="email"
                  type="email"
                  placeholder="username@email.com"
                  autocomplete="email"
                  required
                />
              </div>
            </div>

            <button type="submit" class="login-button">Send code →</button>
            <p id="message" class="message" aria-live="polite"></p>
          </form>

          <div class="signup">
            <a href="loginpage.html">Back to login</a>
          </div>
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById("resetform");
      const emailInput = document.getElementById("email");
      const message = document.getElementById("message");

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        if (!emailInput.validity.valid) {
          emailInput.reportValidity();
          return;
        }

        message.textContent =
          "If an account exists for this email, you’ll receive a reset link.";
        message.classList.remove("error");
      });
    </script>
  </body>
</html>
